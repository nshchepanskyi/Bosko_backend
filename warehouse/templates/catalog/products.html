<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товари</title>
</head>
<body>
    <h1>Товари</h1>

    <table>
        <thead>
            <tr><th>Назва</th><th>Опис</th><th>Ціна</th><th>Кількість</th></tr>
        </thead>
        <tbody>
            {% for product in products %}
                <tr>
                    <td>{{ product.name }}</td>
                    <td>{{ product.description|default:'—' }}</td>
                    <td>{{ product.price }}</td>
                    <td>{{ product.quantity }}</td>
                </tr>
            {% empty %}
                <tr><td colspan="4">Товарів поки немає.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
