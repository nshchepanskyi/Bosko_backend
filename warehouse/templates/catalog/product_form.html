{% extends 'base.html' %}

{% block title %}Новий товар | Склад{% endblock %}

{% block content %}
    <div class="page-heading">
        <div>
            <p class="eyebrow">Облік запасів</p>
            <h1>Новий товар</h1>
        </div>
    </div>
    <form class="product-form" method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="form-field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <div class="form-actions">
            <a class="button button-quiet" href="{% url 'catalog:product_list' %}">Скасувати</a>
            <button class="button button-primary" type="submit">Зберегти товар</button>
        </div>
    </form>
{% endblock %}
